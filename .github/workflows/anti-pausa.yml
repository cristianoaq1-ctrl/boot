
name: Bot Anti-Pausa Supabase

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-banco:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Consultar banco Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 30 \
            --get \
            "${SUPABASE_URL%/}/rest/v1/bot_atividade" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1"

          echo "Consulta ao Supabase concluida!"
